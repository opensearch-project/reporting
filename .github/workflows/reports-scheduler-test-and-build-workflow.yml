name: Test and Build Reports Scheduler

on: [push, pull_request]

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch

  linux-build:
    needs: Get-CI-Image-Tag
    strategy:
      matrix:
        java:
          - 21
    runs-on: ubuntu-latest
    container:
      # using the same image which is used by opensearch-build team to build the OpenSearch Distribution
      # this image tag is subject to change as more dependencies and updates will arrive over time
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      # need to switch to root so that github actions can install runner binary on container without permission issues.
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}

    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Checkout Reports Scheduler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: RunBackwards Compatibility Tests
        run: |
          echo "Running backwards compatibility tests ..."
          chown -R 1000:1000 `pwd`
          su `id -un 1000` -c "./gradlew bwcTestSuite"

      - name: Build with Gradle
        run: |
          chown -R 1000:1000 `pwd`
          su `id -un 1000` -c "./gradlew build"

      - name: Upload coverage
        uses: codecov/codecov-action@29386c70ef20e286228c72b668a06fd0e8399192 # v1
        with:
          flags: reports-scheduler
          directory: reports-scheduler/
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Create Artifact Path
        run: |
          mkdir -p reports-scheduler-builds
          cp -r ./build/distributions/*.zip reports-scheduler-builds/
          chown -R 1000:1000 `pwd`

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-scheduler-linux-${{ matrix.java }}
          path: reports-scheduler-builds

  windows-build:
    strategy:
      matrix:
        java:
          - 21
    runs-on: windows-latest

    steps:
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Checkout Reports Scheduler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build with Gradle
        run: |
          ./gradlew.bat build

      - name: Create Artifact Path
        run: |
          mkdir -p reports-scheduler-builds
          cp -r ./build/distributions/*.zip reports-scheduler-builds/

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-scheduler-windows-${{ matrix.java }}
          path: reports-scheduler-builds
  
  macos-build:
    strategy:
      matrix:
        java:
          - 21
    runs-on: macos-latest

    steps:
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      # reports-scheduler
      - name: Checkout Reports Scheduler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build with Gradle
        run: |
          ./gradlew build

      - name: Create Artifact Path
        run: |
          mkdir -p reports-scheduler-builds
          cp -r ./build/distributions/*.zip reports-scheduler-builds/

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-scheduler-macos-${{ matrix.java }}
          path: reports-scheduler-builds
