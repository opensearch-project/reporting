name: Test and Build Reports Scheduler

on: [push, pull_request]

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@main
    with:
      product: opensearch

  linux-build:
    needs: Get-CI-Image-Tag
    strategy:
      matrix:
        java: [21, 25]
    runs-on: ubuntu-latest
    container:
      # using the same image which is used by opensearch-build team to build the OpenSearch Distribution
      # this image tag is subject to change as more dependencies and updates will arrive over time
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      # need to switch to root so that github actions can install runner binary on container without permission issues.
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Checkout Reports Scheduler
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - name: RunBackwards Compatibility Tests
        run: |
          echo "Running backwards compatibility tests ..."
          chown -R 1000:1000 `pwd`
          su `id -un 1000` -c "./gradlew bwcTestSuite"

      - name: Build with Gradle
        run: |
          chown -R 1000:1000 `pwd`
          su `id -un 1000` -c "./gradlew build"

      - name: Upload coverage report artifact
        if: ${{ !cancelled() && matrix.java == 21 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 1
          if-no-files-found: error

      - name: Create Artifact Path
        run: |
          mkdir -p reports-scheduler-builds
          cp -r ./build/distributions/*.zip reports-scheduler-builds/
          chown -R 1000:1000 `pwd`

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-scheduler-linux-${{ matrix.java }}
          path: reports-scheduler-builds

  upload-coverage:
    needs: linux-build
    name: Upload coverage report to Codecov
    if: ${{ !cancelled() && github.repository == 'opensearch-project/reporting' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reports Scheduler
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download coverage report
        id: download-coverage
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jacoco-coverage-report
          path: coverage

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: steps.download-coverage.outcome == 'success'
        with:
          flags: reports-scheduler
          directory: coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  build-windows-macos:
    strategy:
      # Run all jobs
      fail-fast: false
      matrix:
        java: [21, 25]
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Checkout Reports Scheduler
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build with Gradle
        run: |
          ./gradlew build

      - name: Create Artifact Path
        run: |
          mkdir -p reports-scheduler-builds
          cp -r ./build/distributions/*.zip reports-scheduler-builds/

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eports-scheduler-${{ matrix.os }}
          path: eports-scheduler-builds
